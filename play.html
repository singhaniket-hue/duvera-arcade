<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Play · Duvera Arcade</title><link rel="icon" href="games/clumsy-bird/data/img/favicon.ico"><link rel="stylesheet" href="assets/arcade.css"><script src="assets/player.js" defer></script></head>
<body class="play-body">
  <header class="player-bar">
    <a class="back-link" href="./">← All games</a>
    <div class="player-info"><h1 id="game-title">Choose a game</h1><p id="game-controls"></p></div>
    <div class="player-actions"><button class="plain-button" id="focus-game" type="button" hidden>Focus game</button><button class="plain-button" id="fullscreen" type="button" hidden>Full screen</button></div>
  </header>
  <p class="player-status" id="player-status" role="status" hidden></p>
  <main class="player-error" id="player-error"><h2>Pick something to play.</h2><p><a href="./">Browse the arcade</a></p></main>
  <iframe class="game-frame" id="game-frame" title="Game" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>
  <noscript><p class="player-status">JavaScript is required to launch a game. <a href="./">Return to the arcade.</a></p></noscript>
</body>
</html>

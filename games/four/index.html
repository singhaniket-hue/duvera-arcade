<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four · Duvera Arcade</title><link rel="stylesheet" href="../../assets/mini-game.css"><link rel="stylesheet" href="four.css"></head>
<body><main class="mini four-game"><header><a class="home" href="../../?creator=default">← Arcade</a><h1>Four</h1><button id="voice" hidden>Voice on</button></header>
<div class="four-layout"><section class="playfield"><p id="status" role="status">Connect four in any direction.</p><div id="board" aria-label="Four-in-a-row board"></div><div id="columns" aria-label="Drop a piece"></div><p class="keyboard-help">Tap a column · Keys 1–7 · ← → then Space</p></section>
<aside class="four-controls"><img class="portrait" alt="Creator reaction" hidden><div class="token-key"><span>● You</span><span>★ Opponent</span></div><label id="difficulty-label">Bot <select id="difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option></select></label><button id="solo">Play solo</button><button id="pause" hidden>Pause</button><button id="create">Invite a friend</button><button id="copy" hidden>Copy invite</button><input id="invite" aria-label="Invite link" readonly hidden><button id="ready" hidden>Ready</button><button id="rematch" hidden>Rematch</button><button id="claim" hidden>Claim timeout</button><button id="reconnect" hidden>Reconnect</button><button id="leave" hidden>Leave room</button><p id="connection" role="status"></p><p id="notice" role="alert"></p><p class="room-help">Private rooms · two players.<br>Your seat stays yours on refresh. Rooms expire after 24 hours.</p></aside></div></main>
<script src="../../assets/creator-profile.js"></script><script src="../../assets/creator-audio.js"></script><script src="../../assets/room-config.js"></script><script type="module" src="game.mjs"></script></body></html>

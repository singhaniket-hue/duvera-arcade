name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: npm run check && npm run check:creator
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile touch and layout checks
        run: npm run check:mobile
        env:
          SCREENSHOT_DIR: mobile-screenshots
      - name: Moosher edition mobile checks
        run: npm run check:mobile
        env:
          CREATOR_EDITION: moosher
          SCREENSHOT_DIR: moosher-screenshots
      - name: Desktop gameplay, persistence and audio checks
        run: npm run check:desktop
      - name: Stack mechanics and browser checks
        run: npm run check:stack
      - name: Four mechanics and independent multiplayer browsers
        run: |
          npm ci --prefix multiplayer
          node multiplayer/node_modules/wrangler/bin/wrangler.js dev --config multiplayer/wrangler.jsonc --port 8787 > /tmp/duvera-rooms.log 2>&1 &
          ROOM_PID=$!
          trap 'kill "$ROOM_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -s http://localhost:8787 > /dev/null; then break; fi
            sleep 1
          done
          npm run check:four
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: |
            mobile-screenshots
            moosher-screenshots
            output/playwright
          if-no-files-found: ignore
